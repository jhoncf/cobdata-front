server {
  listen 80;
  server_name _;
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  index index.html;
  # Prevent search engines from indexing any CRM or public regularization URL.
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

  location /api/ {
    proxy_pass http://host.docker.internal:18080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /webhooks/ {
    proxy_pass http://host.docker.internal:18080/webhooks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The SPA shell must always be fresh after a deploy. JavaScript assets are
  # content-hashed, but a cached index.html can keep pointing at an old bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }
}
